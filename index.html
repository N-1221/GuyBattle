<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Battle Sim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- キャラ選択 -->
  <div id="char-select">
    <h2>キャラクター選択</h2>
    <div class="cs-mode" id="cs-mode">
      <button class="cs-mode-btn active" data-mode="1">1 vs 1</button>
      <button class="cs-mode-btn" data-mode="3">3 vs 3</button>
    </div>
    <div class="cs-row">
      <div class="cs-panel">
        <div class="cs-cards" id="cs-p1"></div>
      </div>
      <div class="cs-vs">VS</div>
      <div class="cs-panel">
        <div class="cs-cards" id="cs-p2"></div>
      </div>
    </div>
    <button id="cs-start">▶ 対戦スタート</button>
  </div>

  <!-- バトル -->
  <div id="battle">
    <div id="scoreboard">
      <div class="sb-title">
        <span id="name1">Player 1</span>
        <span class="sb-vs"> vs </span>
        <span id="name2">Player 2</span>
      </div>
      <div class="sb-sub">
        <span class="s-num" id="sc1">0</span>
        <span id="msg">— vs —</span>
        <span class="s-num" id="sc2">0</span>
      </div>
      <div class="sb-teams">
        <div class="team-icons" id="team1-icons"></div>
        <div class="team-icons" id="team2-icons"></div>
      </div>
    </div>
    <div id="arena-wrap">
      <canvas id="arena" width="500" height="500"></canvas>
      <div id="hp-badges"></div>
    </div>
    <div id="ctrl">
      <button id="btn-toggle">⏸ 一時停止</button>
      <button id="btn-reset">↺ リセット</button>
    </div>
  </div>

</div>
<script src="characters.js"></script>
<script src="engine-core.js"></script>
<script src="ui-flow.js"></script>
<script src="physics-combat-utils.js"></script>
<script src="football.js"></script>
<script src="ghost.js"></script>
<script src="boxing.js"></script>
<script src="darts.js"></script>
<script src="tennis.js"></script>
<script src="pingpong.js"></script>
<script src="bomb.js"></script>
<script src="landmine.js"></script>
<script src="gunman.js"></script>
<script src="trainer.js"></script>
<script src="timetraveler.js"></script>
<script src="twins.js"></script>
<script src="draw-core.js"></script>
<script src="game-flow.js"></script>
</body>
</html>
