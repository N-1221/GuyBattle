<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Battle Sim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- キャラ選択 -->
  <div id="char-select">
    <h2>キャラクター選択</h2>
    <div class="cs-row">
      <div class="cs-panel">
        <div class="cs-cards" id="cs-p1"></div>
      </div>
      <div class="cs-vs">VS</div>
      <div class="cs-panel">
        <div class="cs-cards" id="cs-p2"></div>
      </div>
    </div>
    <button id="cs-start">▶ 対戦スタート</button>
  </div>

  <!-- バトル -->
  <div id="battle">
    <div id="scoreboard">
      <div class="sb-title">
        <span id="name1">Player 1</span>
        <span class="sb-vs"> vs </span>
        <span id="name2">Player 2</span>
      </div>
      <div class="sb-sub">
        <span class="s-num" id="sc1">0</span>
        <span id="msg">— vs —</span>
        <span class="s-num" id="sc2">0</span>
      </div>
    </div>
    <div id="arena-wrap">
      <canvas id="arena" width="500" height="500"></canvas>
      <div id="hp-badges"></div>
    </div>
    <div id="ctrl">
      <button id="btn-toggle">⏸ 一時停止</button>
      <button id="btn-reset">↺ リセット</button>
    </div>
  </div>

</div>
<script src="characters.js"></script>
<script src="script.js"></script>
</body>
</html>
